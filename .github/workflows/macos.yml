name: macOS

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  checks: write
  pull-requests: write


jobs:
  build-test:
    runs-on: macos-latest

    strategy:
      matrix:
        include:
          - name: macOS-latest-AppleClang

          - name: macOS-latest-AppleClang-Sanitizers
            extra_cmake: '-DENCODEC_ENABLE_SANITIZERS=ON'

    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew update
          brew install ninja cmake

      - name: Run CMake configuration and build
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            ${{ matrix.extra_cmake }}
          cmake --build build --parallel

      - name: Run unit tests
        run: |
          mkdir -p build/test-results
          ./build/encodec_tests --reporters=junit --out=build/test-results/encodec-tests-${{ matrix.name }}.xml

      - name: Upload JUnit XML artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.name }}
          path: build/test-results/*.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ always() }}
        with:
          name: Unit Tests (${{ matrix.os }})
          path: build/test-results/encodec-tests-${{ matrix.name }}.xml
          reporter: java-junit
          fail-on-error: "false"
