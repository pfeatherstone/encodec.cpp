name: Python

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test
        run: |
          mkdir -p build/test-results
          cd scripts
          pytest unit.py --junitxml=../build/test-results/pytest-results-${{ matrix.os }}.xml

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.os }}
          path: build/test-results/pytest-results-${{ matrix.os }}.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ always() }}
        with:
          name: PyTorch Unit Tests (${{ matrix.os }})
          path: build/test-results/pytest-results-${{ matrix.os }}.xml
          reporter: java-junit
          fail-on-error: "false"