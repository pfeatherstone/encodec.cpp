name: Windows

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  checks: write
  pull-requests: write

  
jobs:
  windows-msvc:
    runs-on: windows-latest
    name: Windows MSVC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build tests
        run: |
          cmake . -B build
          cmake --build build --config RelWithDebInfo --parallel

      - name: Run unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/test-results | Out-Null
          build\RelWithDebInfo\encodec_tests.exe --reporters=junit --out=build/test-results/encodec-tests-${{ matrix.name }}.xml

      - name: Upload JUnit XML artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.name }}
          path: build/test-results/*.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ always() }}
        with:
          name: Unit Tests (${{ matrix.os }})
          path: build/test-results/encodec-tests-${{ matrix.name }}.xml
          reporter: java-junit
          fail-on-error: "false"
